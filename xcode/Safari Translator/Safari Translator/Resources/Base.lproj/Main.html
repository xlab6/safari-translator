<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'">
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
    <title>Safari Translator</title>
    <link rel="stylesheet" href="../Style.css">
    <script src="../Script.js" defer></script>
</head>
<body>
    <main class="welcome">
        <img class="app-icon" src="../Icon.png" width="112" height="112" alt="Safari Translator 图标">

        <h1>网页翻译</h1>
        <p class="tagline">自动整页翻译 · 划词翻译 · 多翻译服务</p>

        <div class="status">
            <span class="status-dot" aria-hidden="true"></span>
            <p class="state-unknown">在 Safari 设置中启用「Safari Translator」扩展即可开始使用。</p>
            <p class="state-on">扩展已启用。打开任意网页即可自动翻译整页，也可以划词或使用右键菜单。</p>
            <p class="state-off">扩展当前已关闭。请在 Safari 设置 → 扩展中启用它。</p>
        </div>

        <button class="open-preferences" type="button">打开 Safari 扩展设置</button>

        <p class="hint">
            默认自动翻译网页；可在扩展弹窗或设置中关闭，划词和右键菜单始终可用。
        </p>
    </main>
</body>
</html>
